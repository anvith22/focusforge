databases:
  - name: focusforge-postgres
    databaseName: focusforge
    user: focusforge
    plan: free

services:
  # 1. Backend REST API (Express + Node.js)
  - type: web
    name: focusforge-api
    runtime: node
    plan: free
    buildCommand: npm install && npm run build:api && npm run migrate
    startCommand: npm run start -w @focusforge/api
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: focusforge-postgres
          property: connectionString
      - key: CLIENT_ORIGIN
        fromService:
          type: web
          name: focusforge-web
          property: host
          urlPrefix: https://
      - key: APP_TIMEZONE
        value: Asia/Kolkata

  # 2. Frontend SPA (Vite + React)
  - type: web
    name: focusforge-web
    runtime: static
    plan: free
    buildCommand: npm install && npm run build:web
    staticPublishPath: apps/web/dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: focusforge-api
          property: host
          urlPrefix: https://
          urlPostfix: /api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

